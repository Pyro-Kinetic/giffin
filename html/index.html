<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- google fonts | syne mono static & roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Syne+Mono&display=swap"
          rel="stylesheet">

    <!-- font awesome -->
    <script src="https://kit.fontawesome.com/c13244d5b1.js" crossorigin="anonymous"></script>

    <!-- stylesheet -->
    <link rel="stylesheet" href="../css/style.css">

    <title>Giffin</title>
</head>

<body>
<div class="container">

    <!-- navbar -->
    <nav class="navbar">
        <span class="syne-mono-regular" id="web-title">Giffin</span>
        <i class="fa-solid fa-bars"></i>
    </nav>

    <!-- modal -->
    <dialog id="gif-select">
        <div class="select-btn-div">
            <button class="syne-mono-regular select-btn-g" id="gifs-btn">gifs</button>
<!--            <button class="roboto-400 select-btn" id="emojis-btn">Clips</button>-->
            <button class="syne-mono-regular select-btn-s" id="stickers-btn">stickers</button>
        </div>
    </dialog>

    <!-- search bar -->
    <form class="search-bar" id="gif-search">
        <label for="search"></label>
        <input type="text" id="search" name="search" placeholder="👓✨">
        <button class="btn" type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
    </form>

    <!-- GIFs -->
    <main class="gif-container"></main>

    <!-- scroll to the top button -->
    <button id="scroll-top" class="scroll-top">
        <i class="fa-solid fa-arrow-up"></i>
    </button>
</div>

<!-- scripts -->
<script src="https://cdn.jsdelivr.net/npm/axios@0.21.1/dist/axios.min.js"></script>
<script src="../js/main.js"></script>
</body>
</html>
